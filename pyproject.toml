[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcriptomics-analysis"
version = "1.0.0"
description = "Enhanced autonomous spatial transcriptomics analysis pipeline for Stereo-seq data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Maiqi Zhang" },
]
dependencies = [
  "h5py>=3.14.0",
  "matplotlib>=3.9.4",
  "numpy>=2.0.2",
  "openai>=2.43.0",
  "pandas>=2.3.3",
  "scikit-learn>=1.6.1",
  "scipy>=1.13.1",
  "seaborn>=0.13.2",
  "umap-learn>=0.5.12",
  "watchdog>=6.0.0",
]

[project.urls]
Repository = "https://github.com/wandreopoulos/agentic_spatial_transcriptomics_analysis"

[project.scripts]
asta-baseline = "asta.cli:baseline"
asta-ensemble = "asta.cli:ensemble"
asta-annotate = "asta.cli:annotate"
asta-agent    = "asta.cli:agent"
asta-notify   = "asta.cli:notify"
asta-watch    = "asta.watch_runner:main"
asta-run           = "asta.cli:run_pipeline"
asta-watch-launchd = "asta.cli:watch_launchd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asta = ["*.sh"]
